name: Red Assistant

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  run-command:
    # issue_comment is also emitted for ordinary issues, so restrict this to PRs
    # whose new comment contains the @red trigger.
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@red')
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Run Red assistant command
        id: command
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: bash .github/scripts/red-assistant.sh

      - name: Report result on the pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ steps.command.outcome }}' === 'success';
            const message = success
              ? '✅ `@red` completed the demo command.'
              : '❌ `@red` failed while running the demo command.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message,
            });
